<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Family</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #102a43, #176b87);
}

h1 {
    text-align: center;
    color: white;
}

.box {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 15px;
}

h2 {
    color: #145374;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #145374;
    color: white;
    font-size: 16px;
}

button:active {
    opacity: 0.8;
}

.view {
    background: #1976d2;
}

.download {
    background: #2e7d32;
}

.delete {
    background: #c62828;
}

.back {
    background: #555;
}

.lock {
    background: #8e0000;
}

.logout {
    background: #6a1b9a;
}

.item {
    background: #f1f1f1;
    padding: 15px;
    margin-top: 10px;
    border-radius: 10px;
}

#viewer {
    display: none;
}

.empty {
    text-align: center;
    color: #777;
}

#privateContent {
    display: none;
}

.message {
    text-align: center;
    font-weight: bold;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://xifnolhkgdonmmetpkyl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iEIud6ZWUjH_64b7NEoOqw_Hdu_hA3X";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

</script>

</head>

<body>

<h1>🔒 Private Family</h1>


<!-- LOGIN -->

<div class="box" id="loginBox">

<h2>🔐 Private Family Login</h2>

<input
    type="email"
    id="loginEmail"
    placeholder="Enter authorized email">

<input
    type="password"
    id="loginPassword"
    placeholder="Enter password">

<button id="loginButton">
🔐 Login
</button>

<p id="loginMessage" class="message"></p>

</div>


<!-- PRIVATE AREA -->

<div id="privateContent">


<!-- DOCUMENT UPLOAD -->

<div class="box">

<h2>📁 Private Documents</h2>

<input
    type="text"
    id="fileTitle"
    placeholder="Enter document title">

<input
    type="file"
    id="familyFile"
    accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">

<button id="saveFileButton">
📤 Upload Document
</button>

<p id="message" class="message"></p>

<small>
📄 Documents only. Maximum size: 10 MB.
</small>

</div>


<!-- SAVED DOCUMENTS -->

<div class="box">

<h2>📂 Saved Documents</h2>

<div id="fileList">

<p class="empty">
No private documents saved yet.
</p>

</div>

</div>


<!-- VIEWER -->

<div class="box" id="viewer"></div>


<!-- SECURITY -->

<div class="box">

<h2>🔒 Private Security</h2>

<button
    id="logoutButton"
    class="logout">

🚪 Logout

</button>

<button
    id="lockButton"
    class="lock">

🔒 Lock Private Family

</button>

<button
    id="backButton"
    class="back">

⬅️ Back to Family

</button>

</div>

</div>


<script>


/* =========================
   LOGIN
========================= */

async function loginPrivate() {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document
        .getElementById("loginMessage");


    if (!email || !password) {

        message.innerText =
            "Please enter email and password.";

        return;
    }


    message.innerText =
        "Logging in...";


    const { error } =
        await supabaseClient
        .auth
        .signInWithPassword({

            email: email,
            password: password

        });


    if (error) {

        console.error(error);

        message.innerText =
            "❌ Login failed: " +
            error.message;

        return;
    }


    message.innerText = "";


    document
        .getElementById("loginBox")
        .style.display = "none";


    document
        .getElementById("privateContent")
        .style.display = "block";


    await showFiles();

}


/* =========================
   UPLOAD DOCUMENT
========================= */

async function saveFile() {

    const title =
        document
        .getElementById("fileTitle")
        .value
        .trim();


    const input =
        document
        .getElementById("familyFile");


    const message =
        document
        .getElementById("message");


    if (!title) {

        alert(
            "Please enter document title."
        );

        return;
    }


    if (
        !input.files ||
        input.files.length === 0
    ) {

        alert(
            "Please select a document."
        );

        return;
    }


    const file =
        input.files[0];


    /* 10 MB LIMIT */

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose a document smaller than 10 MB."
        );

        return;
    }


    /* ALLOWED FILES */

    const allowedExtensions = [

        ".pdf",
        ".doc",
        ".docx",
        ".xls",
        ".xlsx",
        ".ppt",
        ".pptx",
        ".txt"

    ];


    const lowerName =
        file.name.toLowerCase();


    const extension =
        "." +
        lowerName
        .split(".")
        .pop();


    if (
        !allowedExtensions
        .includes(extension)
    ) {

        alert(
            "Please select a PDF, Word, Excel, PowerPoint or TXT document."
        );

        return;
    }


    /* GET LOGGED-IN USER */

    const { data: userData, error: userError } =
        await supabaseClient
        .auth
        .getUser();


    if (
        userError ||
        !userData ||
        !userData.user
    ) {

        alert(
            "Your login session has expired. Please log in again."
        );

        return;
    }


    const user =
        userData.user;


    /* SAFE FILE NAME */

    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    /*
       SECURE STORAGE PATH

       private / USER ID / FILE
    */

    const filePath =
        "private/" +
        user.id +
        "/" +
        Date.now() +
        "_" +
        safeName;


    message.innerText =
        "Uploading document...";


    /* UPLOAD TO STORAGE */

    const { error: uploadError } =
        await supabaseClient
        .storage
        .from("private-files")
        .upload(

            filePath,

            file,

            {
                cacheControl: "3600",
                upsert: false
            }

        );


    if (uploadError) {

        console.error(uploadError);

        message.innerText = "";

        alert(
            "❌ Upload failed:\n\n" +
            uploadError.message
        );

        return;
    }


    /* SAVE DATABASE RECORD */

    const { error: databaseError } =
        await supabaseClient
        .from("private_documents")
        .insert([

            {
                title: title,

                description: "",

                file_path: filePath,

                file_type: file.type,

                owner_id: user.id
            }

        ]);


    if (databaseError) {

        console.error(databaseError);


        /* REMOVE UPLOADED FILE */

        await supabaseClient
            .storage
            .from("private-files")
            .remove([

                filePath

            ]);


        message.innerText = "";

        alert(
            "❌ Could not save document record:\n\n" +
            databaseError.message
        );

        return;
    }


    /* CLEAR FORM */

    document
        .getElementById("fileTitle")
        .value = "";


    document
        .getElementById("familyFile")
        .value = "";


    message.innerText =
        "✅ Document uploaded successfully!";


    alert(
        "✅ Private document uploaded successfully!"
    );


    await showFiles();

}


/* =========================
   SHOW DOCUMENTS
========================= */

async function showFiles() {

    const list =
        document
        .getElementById("fileList");


    list.innerHTML =
        "<p>Loading documents...</p>";


    /*
       RLS automatically returns
       only documents belonging
       to the logged-in user.
    */

    const { data, error } =
        await supabaseClient
        .from("private_documents")
        .select("*")
        .order(

            "created_at",

            {
                ascending: false
            }

        );


    if (error) {

        console.error(error);

        list.innerHTML =
            "<p class='empty'>Unable to load documents.</p>";

        return;
    }


    list.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            "<p class='empty'>No private documents saved yet.</p>";

        return;
    }


    data.forEach(function(file) {


        const item =
            document.createElement("div");

        item.className =
            "item";


        const title =
            document.createElement("h3");

        title.innerText =
            "📄 " +
            file.title;


        const name =
            document.createElement("p");

        name.innerText =
            "Document: " +
            getFileName(
                file.file_path
            );


        /* VIEW BUTTON */

        const viewButton =
            document.createElement("button");

        viewButton.className =
            "view";

        viewButton.innerText =
            "👁️ View";


        viewButton.onclick =
            function() {

                viewFile(file);

            };


        /* DOWNLOAD BUTTON */

        const downloadButton =
            document.createElement("button");

        downloadButton.className =
            "download";

        downloadButton.innerText =
            "⬇️ Download";


        downloadButton.onclick =
            function() {

                downloadFile(file);

            };


        /* DELETE BUTTON */

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete";

        deleteButton.innerText =
            "🗑️ Delete";


        deleteButton.onclick =
            function() {

                deleteFile(file);

            };


        item.appendChild(title);

        item.appendChild(name);

        item.appendChild(viewButton);

        item.appendChild(downloadButton);

        item.appendChild(deleteButton);

        list.appendChild(item);

    });

}


/* =========================
   FILE NAME
========================= */

function getFileName(path) {

    const parts =
        path.split("/");

    return parts[
        parts.length - 1
    ];

}


/* =========================
   VIEW
========================= */

async function viewFile(file) {

    const viewer =
        document
        .getElementById("viewer");


    viewer.style.display =
        "block";


    viewer.innerHTML =
        "<p>Preparing document...</p>";


    const { data, error } =
        await supabaseClient
        .storage
        .from("private-files")
        .createSignedUrl(

            file.file_path,

            3600

        );


    if (error) {

        console.error(error);

        viewer.innerHTML =
            "<p>❌ Unable to open document.</p>";

        return;
    }


    viewer.innerHTML = "";


    const heading =
        document.createElement("h2");

    heading.innerText =
        "👁️ " +
        file.title;


    viewer.appendChild(
        heading
    );


    const fileName =
        document.createElement("p");


    fileName.innerText =
        getFileName(
            file.file_path
        );


    viewer.appendChild(
        fileName
    );


    /* OPEN */

    const openButton =
        document.createElement("button");


    openButton.className =
        "view";


    openButton.innerText =
        "📄 Open Document";


    openButton.onclick =
        function() {

            window.open(
                data.signedUrl,
                "_blank"
            );

        };


    viewer.appendChild(
        openButton
    );


    /* DOWNLOAD */

    const downloadButton =
        document.createElement("button");


    downloadButton.className =
        "download";


    downloadButton.innerText =
        "⬇️ Download Document";


    downloadButton.onclick =
        async function() {

            await downloadFile(file);

        };


    viewer.appendChild(
        downloadButton
    );


    /* CLOSE */

    const closeButton =
        document.createElement("button");


    closeButton.className =
        "back";


    closeButton.innerText =
        "✖️ Close";


    closeButton.onclick =
        function() {

            viewer.style.display =
                "none";


            viewer.innerHTML = "";

        };


    viewer.appendChild(
        closeButton
    );

}


/* =========================
   DOWNLOAD
========================= */

async function downloadFile(file) {

    const fileName =
        getFileName(
            file.file_path
        );


    const { data, error } =
        await supabaseClient
        .storage
        .from("private-files")
        .createSignedUrl(

            file.file_path,

            300

        );


    if (error) {

        console.error(error);

        alert(
            "❌ Unable to create download link:\n\n" +
            error.message
        );

        return;
    }


    const link =
        document.createElement("a");


    link.href =
        data.signedUrl;


    link.target =
        "_blank";


    link.download =
        fileName;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

}


/* =========================
   DELETE
========================= */

async function deleteFile(file) {

    const answer =
        confirm(
            "⚠️ Are you sure you want to delete this document?"
        );


    if (!answer) {
        return;
    }


    /* DELETE STORAGE FILE */

    const { error: storageError } =
        await supabaseClient
        .storage
        .from("private-files")
        .remove([

            file.file_path

        ]);


    if (storageError) {

        console.error(
            storageError
        );

        alert(
            "❌ Could not delete document:\n\n" +
            storageError.message
        );

        return;
    }


    /* DELETE DATABASE RECORD */

    const { error: databaseError } =
        await supabaseClient
        .from("private_documents")
        .delete()
        .eq(

            "id",

            file.id

        );


    if (databaseError) {

        console.error(
            databaseError
        );

        alert(
            "❌ File removed from storage, but database record could not be deleted."
        );

        return;
    }


    alert(
        "✅ Private document deleted."
    );


    await showFiles();

}


/* =========================
   LOGOUT
========================= */

async function logoutPrivate() {

    await supabaseClient
        .auth
        .signOut();


    document
        .getElementById("privateContent")
        .style.display = "none";


    document
        .getElementById("loginBox")
        .style.display = "block";


    document
        .getElementById("loginPassword")
        .value = "";


    document
        .getElementById("loginMessage")
        .innerText =
        "You have been logged out.";

}


/* =========================
   LOCK
========================= */

async function lockPrivateFamily() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "family.html";

}


/* =========================
   BACK
========================= */

function goBack() {

    window.location.href =
        "family.html";

}


/* =========================
   BUTTON CONNECTIONS
========================= */

document
    .getElementById("loginButton")
    .addEventListener(

        "click",

        loginPrivate

    );


document
    .getElementById("saveFileButton")
    .addEventListener(

        "click",

        saveFile

    );


document
    .getElementById("logoutButton")
    .addEventListener(

        "click",

        logoutPrivate

    );


document
    .getElementById("lockButton")
    .addEventListener(

        "click",

        lockPrivateFamily

    );


document
    .getElementById("backButton")
    .addEventListener(

        "click",

        goBack

    );


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

    const { data } =
        await supabaseClient
        .auth
        .getSession();


    if (
        data &&
        data.session
    ) {

        document
            .getElementById("loginBox")
            .style.display =
            "none";


        document
            .getElementById("privateContent")
            .style.display =
            "block";


        await showFiles();

    }

}


checkLogin();

</script>

</body>
  </html>
