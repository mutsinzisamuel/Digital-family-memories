<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Family Memories</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#050505,#191919,#050505);
    min-height:100vh;
}

header{
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    color:#aaa;
}

.container{
    width:92%;
    max-width:800px;
    margin:auto;
}

#homePage{
    display:block;
}

#publicPage{
    display:none;
}

#publicPage:target{
    display:block;
}

body:has(#publicPage:target) #homePage{
    display:none;
}

.main-buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:25px;
}

.main-button{
    display:block;
    width:100%;
    padding:17px;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#222;
    border:1px solid #444;
    border-radius:14px;
    font-size:17px;
}

.main-button:active{
    background:#444;
}

.back-button{
    display:inline-block;
    padding:11px 16px;
    margin-bottom:15px;
    background:#333;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.search{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #444;
    background:#111;
    color:white;
    font-size:16px;
    margin:15px 0 20px;
}

.feed{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.post{
    background:#151515;
    border:1px solid #292929;
    border-radius:17px;
    overflow:hidden;
}

.post-media{
    width:100%;
    background:#111;
}

.post-media img{
    width:100%;
    max-height:600px;
    object-fit:contain;
    display:block;
    cursor:pointer;
}

.post-content{
    padding:16px;
}

.post-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.description{
    color:#ccc;
    line-height:1.5;
    white-space:pre-wrap;
}

.category{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:20px;
    background:#292929;
    color:#ccc;
    font-size:12px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.action-button{
    padding:11px 15px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
}

.download{
    background:#176b3a;
}

.video-container{
    position:relative;
    width:100%;
    background:#111;
}

.video-container video{
    width:100%;
    max-height:600px;
    display:block;
}

.viewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    overflow:auto;
    padding:20px;
}

.viewer.show{
    display:block;
}

.viewer-content{
    max-width:900px;
    margin:auto;
}

.close-button{
    float:right;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#333;
    color:white;
    font-size:25px;
}

.viewer-title{
    clear:both;
    padding-top:15px;
    font-size:24px;
    margin-bottom:10px;
}

.viewer-description{
    color:#ccc;
    line-height:1.5;
    white-space:pre-wrap;
    margin-bottom:15px;
}

.viewer-content img{
    width:100%;
    max-height:80vh;
    object-fit:contain;
}

.viewer-content video{
    width:100%;
    max-height:80vh;
}

.viewer-content iframe{
    width:100%;
    height:80vh;
    border:none;
    background:white;
}

.empty{
    text-align:center;
    padding:40px 10px;
    color:#999;
}

.loading{
    text-align:center;
    padding:30px;
    color:#aaa;
}

</style>
</head>

<body>

<header>

<h1>Digital Family Memories</h1>

<p>Keep the memories. Share the moments.</p>

</header>

<div class="container">

<!-- HOME PAGE -->

<!-- HOME PAGE -->

<div id="homePage">

    <div class="main-buttons">

        <a
        href="family.html#publicPage"
        class="main-button">

        🌍 Public Family

        </a>

        <a
        href="admin.html"
        class="main-button">

        🔒 Private Family

        </a>

    </div>

</div>




</div>

</div>


<!-- PUBLIC PAGE -->

<div id="publicPage">

<a
href="family.html"
class="back-button">

← Back

</a>

<h2>Public Family Memories</h2>

<input
id="searchInput"
class="search"
type="text"
placeholder="Search family memories..."
oninput="searchFamily()"
>

<div
id="publicFeed"
class="feed">

<div class="loading">
Loading family memories...
</div>

</div>

</div>

</div>


<!-- FULL SCREEN VIEWER -->

<div
id="viewer"
class="viewer">

<div class="viewer-content">

<button
class="close-button"
onclick="closeViewer()">

×

</button>

<div id="viewerContent"></div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://xifnolhkgdonmmetpkyl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iEIud6ZWUjH_64b7NEoOqw_Hdu_hA3X";

let supabaseClient = null;

try{

    if(window.supabase){

        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    }

}catch(error){

    console.error(error);

}


/* MEDIA URL */

function getMediaUrl(memory){

    return(
        memory.image_url ||
        memory.media ||
        memory.fileData ||
        ""
    );

}


/* MEDIA TYPE */

function getMediaType(memory){

    return(
        memory.file_type ||
        memory.fileType ||
        memory.mediaType ||
        ""
    ).toLowerCase();

}


/* VIDEO */

function isVideo(memory){

    const type =
    getMediaType(memory);

    const url =
    getMediaUrl(memory).toLowerCase();

    return(
        type.startsWith("video/") ||
        url.includes(".mp4") ||
        url.includes(".webm") ||
        url.includes(".mov")
    );

}


/* IMAGE */

function isImage(memory){

    const type =
    getMediaType(memory);

    const url =
    getMediaUrl(memory).toLowerCase();

    return(
        type.startsWith("image/") ||
        /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(url)
    );

}


/* PDF */

function isPDF(memory){

    const type =
    getMediaType(memory);

    const url =
    getMediaUrl(memory).toLowerCase();

    return(
        type === "application/pdf" ||
        url.includes(".pdf")
    );

}


/* LOAD PUBLIC FEED */

async function loadPublicFeed(){

    const feed =
    document.getElementById("publicFeed");

    if(!feed){
        return;
    }

    feed.innerHTML =
    '<div class="loading">Loading family memories...</div>';

    if(!supabaseClient){

        feed.innerHTML =
        '<div class="empty">Supabase connection unavailable.</div>';

        return;

    }

    try{

        const result =
        await supabaseClient
        .from("memories")
        .select("*")
        .eq("visibility","public")
        .order("created_at",{ascending:false});

        if(result.error){

            console.error(result.error);

            feed.innerHTML =
            '<div class="empty">Unable to load family memories.</div>';

            return;

        }

        window.allPublicMemories =
        result.data || [];

        renderFeed(
            window.allPublicMemories
        );

    }catch(error){

        console.error(error);

        feed.innerHTML =
        '<div class="empty">Unable to load family memories.</div>';

    }

}


/* RENDER FEED */

function renderFeed(memories){

    const feed =
    document.getElementById("publicFeed");

    feed.innerHTML = "";

    if(!memories.length){

        feed.innerHTML =
        '<div class="empty">No public memories found.</div>';

        return;

    }

    memories.forEach(function(memory){

        const post =
        document.createElement("div");

        post.className =
        "post";

        const url =
        getMediaUrl(memory);

        let mediaHTML = "";

        if(isImage(memory)){

            mediaHTML = `
                <div class="post-media">

                    <img
                    src="${url}"
                    alt="${escapeHTML(memory.title || "Family memory")}"
                    onclick="openViewer(${memory.id})">

                </div>
            `;

        }else if(isVideo(memory)){

            mediaHTML = `
                <div class="post-media">

                    <div class="video-container">

                        <video
                        controls
                        preload="metadata"
                        poster="${memory.thumbnail_url || ""}"
                        data-video-id="${memory.id}"
                        onclick="openViewer(${memory.id})">

                            <source src="${url}">
                            Your browser does not support video.

                        </video>

                    </div>

                </div>
            `;

        }else if(isPDF(memory)){

            mediaHTML = `
                <div
                class="post-media"
                style="padding:25px;text-align:center;">

                    📄 PDF DOCUMENT

                </div>
            `;

        }

        post.innerHTML = `

            ${mediaHTML}

            <div class="post-content">

                <div class="post-title">
                    ${escapeHTML(memory.title || "Family Memory")}
                </div>

                ${
                    memory.description
                    ?
                    `<div class="description">
                        ${escapeHTML(memory.description)}
                    </div>`
                    :
                    ""
                }

                ${
                    memory.category
                    ?
                    `<span class="category">
                        ${escapeHTML(memory.category)}
                    </span>`
                    :
                    ""
                }

                <div class="actions">

                    <button
                    class="action-button"
                    onclick="openViewer(${memory.id})">

                        👁️ View

                    </button>

                    ${
                        url
                        ?
                        `<a
                        class="action-button download"
                        href="${url}"
                        download>

                            ⬇️ Download

                        </a>`
                        :
                        ""
                    }

                </div>

            </div>

        `;

        feed.appendChild(post);

    });

}


/* ESCAPE HTML */

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* OPEN VIEWER */

function openViewer(id){

    const memory =
    window.allPublicMemories
    ?.find(function(item){

        return String(item.id) === String(id);

    });

    if(!memory){
        return;
    }

    const viewer =
    document.getElementById("viewer");

    const content =
    document.getElementById("viewerContent");

    const url =
    getMediaUrl(memory);

    let mediaHTML = "";


    /* IMAGE */

    if(isImage(memory)){

        mediaHTML = `
            <img
            src="${url}"
            alt="Family memory">
        `;

    }


    /* VIDEO */

    else if(isVideo(memory)){

        mediaHTML = `
            <video
            controls
            preload="metadata"
            autoplay
            poster="${memory.thumbnail_url || ""}"
            style="width:100%;max-height:80vh;">

                <source src="${url}">
                Your browser does not support video.

            </video>
        `;

    }


    /* PDF */

    else if(isPDF(memory)){

        mediaHTML = `
            <iframe
            src="${url}">
            </iframe>
        `;

    }


    /* OTHER FILE */

    else if(url){

        mediaHTML = `
            <a
            href="${url}"
            target="_blank"
            class="action-button">

            Open file

            </a>
        `;

    }


    content.innerHTML = `

        <div class="viewer-title">

            ${escapeHTML(
                memory.title ||
                "Family Memory"
            )}

        </div>


        ${
            memory.description
            ?
            `<div class="viewer-description">

                ${escapeHTML(
                    memory.description
                )}

            </div>`
            :
            ""
        }


        ${mediaHTML}


        ${
            url
            ?
            `<div class="actions">

                <a
                class="action-button download"
                href="${url}"
                download>

                    ⬇️ Download

                </a>

            </div>`
            :
            ""
        }

    `;


    viewer.classList.add("show");

}


/* CLOSE VIEWER */

function closeViewer(){

    const viewer =
    document.getElementById("viewer");

    const content =
    document.getElementById("viewerContent");


    viewer.classList.remove(
        "show"
    );


    content.innerHTML = "";

}


/* SEARCH */

function searchFamily(){

    const input =
    document.getElementById("searchInput");

    if(!input){
        return;
    }


    const search =
    input.value
    .toLowerCase()
    .trim();


    if(!window.allPublicMemories){
        return;
    }


    if(!search){

        renderFeed(
            window.allPublicMemories
        );

        return;

    }


    const filtered =
    window.allPublicMemories.filter(
        function(memory){

            return(

                String(
                    memory.title || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    memory.description || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    memory.category || ""
                )
                .toLowerCase()
                .includes(search)

            );

        }
    );


    renderFeed(filtered);

}


/* LOAD WHEN PAGE OPENS */

window.addEventListener(
    "load",
    function(){

        loadPublicFeed();

    }
);

</script>

</body>
  </html>
